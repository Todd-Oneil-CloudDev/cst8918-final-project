apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: weather-test

resources:
  - ../base
  - namespace.yaml

images:
  - name: weather-app
    newName: replace-with-acr-name.azurecr.io/weather-app
    newTag: test

patches:
  - target:
      kind: ConfigMap
      name: weather-app-config
    patch: |-
      - op: replace
        path: /data/NODE_ENV
        value: test
      - op: replace
        path: /data/REDIS_HOST
        value: replace-with-test-redis-hostname
