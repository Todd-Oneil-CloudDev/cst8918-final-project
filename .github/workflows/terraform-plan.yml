name: Terraform Plan and TFLint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

  # Azure authentication shared by the repository
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

jobs:

  # =========================================================
  # TFLINT
  # Runs for every pull request targeting main
  # =========================================================
  tflint:
    name: TFLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Show TFLint version
        run: tflint --version

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint for backend
        working-directory: terraform/backend
        run: tflint

      - name: Run TFLint for network
        working-directory: terraform/network
        run: tflint

      - name: Run TFLint for test environment
        working-directory: terraform/environments/test
        run: tflint

      - name: Run TFLint for production environment
        working-directory: terraform/environments/prod
        run: tflint


  # =========================================================
  # SHARED NETWORK PLAN
  # =========================================================
  plan-network:
    name: Plan Shared Network
    runs-on: ubuntu-latest
    needs: tflint

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init - network
        working-directory: terraform/network
        run: |
          terraform init \
            -backend-config=../backend/backend.hcl \
            -backend-config="key=network.tfstate" \
            -input=false

      - name: Terraform validate - network
        working-directory: terraform/network
        run: terraform validate

      - name: Terraform plan - network
        working-directory: terraform/network
        run: terraform plan -no-color -input=false -lock=false


  # =========================================================
  # TEST ENVIRONMENT PLAN
  # Uses GitHub Environment: test
  # =========================================================
  plan-test:
    name: Plan Test Infrastructure
    runs-on: ubuntu-latest
    needs: plan-network
    environment: test

    env:
      # Azure authentication
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}

      # Repository-wide Terraform secrets
      TF_VAR_acr_sku: ${{ secrets.TF_VAR_ACR_SKU }}
      TF_VAR_redis_sku: ${{ secrets.TF_VAR_REDIS_SKU }}

      # Test environment Terraform secrets
      TF_VAR_acr_name: ${{ secrets.TF_VAR_ACR_NAME }}
      TF_VAR_aks_name: ${{ secrets.TF_VAR_AKS_NAME }}
      TF_VAR_node_name: ${{ secrets.TF_VAR_NODE_NAME }}
      TF_VAR_min: ${{ secrets.TF_VAR_MIN }}
      TF_VAR_max: ${{ secrets.TF_VAR_MAX }}
      TF_VAR_aks_version: ${{ secrets.TF_VAR_AKS_VERSION }}
      TF_VAR_aks_dns_prefix: ${{ secrets.TF_VAR_AKS_DNS_PREFIX }}
      TF_VAR_aks_service_dns_ip: ${{ secrets.TF_VAR_AKS_SERVICE_DNS_IP }}
      TF_VAR_redis_name: ${{ secrets.TF_VAR_REDIS_NAME }}

      # Not currently stored as an environment secret
      TF_VAR_aks_service_cidr: "10.10.0.0/16"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init - test
        working-directory: terraform/environments/test
        run: |
          terraform init \
            -backend-config=../../backend/backend.hcl \
            -backend-config="key=test.app.tfstate" \
            -input=false

      - name: Terraform validate - test
        working-directory: terraform/environments/test
        run: terraform validate

      - name: Terraform plan - test
        working-directory: terraform/environments/test
        run: terraform plan -no-color -input=false -lock=false


  # =========================================================
  # PRODUCTION ENVIRONMENT PLAN
  # Uses GitHub Environment: production
  # =========================================================
  plan-production:
    name: Plan Production Infrastructure
    runs-on: ubuntu-latest
    needs: plan-network
    environment: production

    env:
      # Azure authentication
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}

      # Repository-wide Terraform secrets
      TF_VAR_acr_sku: ${{ secrets.TF_VAR_ACR_SKU }}
      TF_VAR_redis_sku: ${{ secrets.TF_VAR_REDIS_SKU }}

      # Production environment Terraform secrets
      TF_VAR_acr_name: ${{ secrets.TF_VAR_ACR_NAME }}
      TF_VAR_aks_name: ${{ secrets.TF_VAR_AKS_NAME }}
      TF_VAR_node_name: ${{ secrets.TF_VAR_NODE_NAME }}
      TF_VAR_min: ${{ secrets.TF_VAR_MIN }}
      TF_VAR_max: ${{ secrets.TF_VAR_MAX }}
      TF_VAR_aks_version: ${{ secrets.TF_VAR_AKS_VERSION }}
      TF_VAR_aks_dns_prefix: ${{ secrets.TF_VAR_AKS_DNS_PREFIX }}
      TF_VAR_aks_service_dns_ip: ${{ secrets.TF_VAR_AKS_SERVICE_DNS_IP }}
      TF_VAR_redis_name: ${{ secrets.TF_VAR_REDIS_NAME }}

      # Not currently stored as an environment secret
      TF_VAR_aks_service_cidr: "10.20.0.0/16"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init - production
        working-directory: terraform/environments/prod
        run: |
          terraform init \
            -backend-config=../../backend/backend.hcl \
            -backend-config="key=prod.app.tfstate" \
            -input=false

      - name: Terraform validate - production
        working-directory: terraform/environments/prod
        run: terraform validate

      - name: Terraform plan - production
        working-directory: terraform/environments/prod
        run: terraform plan -no-color -input=false -lock=false