name: Terraform Apply - Test

on:
  push:
    branches:
      - test
    paths:
      - "terraform/**"
      - "app/**"
      - "k8s/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "remix.config.js"
      - "remix.env.d.ts"
      - "tsconfig.json"
      - ".github/workflows/terraform-apply-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-test
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
  ARM_USE_OIDC: true
  TF_VAR_acr_name: ${{ secrets.TF_VAR_ACR_NAME }}
  TF_VAR_aks_name: ${{ secrets.TF_VAR_AKS_NAME }}
  TF_VAR_node_name: ${{ secrets.TF_VAR_NODE_NAME }}
  TF_VAR_min: ${{ secrets.TF_VAR_MIN }}
  TF_VAR_max: ${{ secrets.TF_VAR_MAX }}
  TF_VAR_aks_version: ${{ secrets.TF_VAR_AKS_VERSION }}
  TF_VAR_aks_dns_prefix: ${{ secrets.TF_VAR_AKS_DNS_PREFIX }}
  TF_VAR_aks_service_cidr: ${{ secrets.TF_VAR_AKS_SERVICE_CIDR }}
  TF_VAR_aks_service_dns_ip: ${{ secrets.TF_VAR_AKS_SERVICE_DNS_IP }}
  TF_VAR_redis_name: ${{ secrets.TF_VAR_REDIS_NAME }}

jobs:
  plan-and-apply:
    name: Plan and Apply Test Infrastructure
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        working-directory: terraform/environments/test
        run: |
          terraform init \
            -backend-config=../../backend/backend.hcl \
            -backend-config="key=test.app.tfstate" \
            -input=false

      - name: Terraform validate
        working-directory: terraform/environments/test
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform/environments/test
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Terraform apply
        working-directory: terraform/environments/test
        run: terraform apply -input=false -auto-approve tfplan

  deploy-code:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    environment: test
    needs: plan-and-apply

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        working-directory: terraform/environments/test
        run: |
          terraform init \
            -backend-config=../../backend/backend.hcl \
            -backend-config="key=test.app.tfstate" \
            -input=false

      - name: Get Terraform outputs
        id: tf-outputs
        working-directory: terraform/environments/test
        run: |
          echo "rg_name=$(terraform output -raw resource_group)" >> "$GITHUB_OUTPUT"
          echo "redis_host=$(terraform output -raw test_redis_hostname)" >> "$GITHUB_OUTPUT"

      - name: Get Redis key
        id: redis-key
        working-directory: terraform/environments/test
        run: |
          KEY=$(terraform output -raw test_redis_primary_access_key)
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.TF_VAR_ACR_NAME}}

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.TF_VAR_ACR_NAME }}.azurecr.io/weather-app:${{ github.sha }} .
          docker push ${{ secrets.TF_VAR_ACR_NAME }}.azurecr.io/weather-app:${{ github.sha }}
      
      - name: Get AKS credentials
        run: az aks get-credentials --resource-group ${{ steps.tf-outputs.outputs.rg_name }} --name ${{ secrets.TF_VAR_AKS_NAME }} --overwrite-existing

      - name: Ensure namespace exists
        run: kubectl apply -f k8s/test/namespace.yaml

      - name: Create/update app secrets
        run: |
          kubectl create secret generic weather-app-secrets \
            --namespace=weather-test \
            --from-literal=WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }} \
            --from-literal=REDIS_PASSWORD=${{ steps.redis-key.outputs.key }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update kustomize overlay with runtime values
        working-directory: k8s/test
        run: |
          kustomize edit set image weather-app=${{ secrets.TF_VAR_ACR_NAME }}.azurecr.io/weather-app:${{ github.sha }}
          sed -i "s/replace-with-test-redis-hostname/${{ steps.tf-outputs.outputs.redis_host }}/" kustomization.yaml

      - name: Deploy to AKS
        run: |
          kubectl apply -k k8s/test
          kubectl rollout status deployment/weather-app -n weather-test

      - name: Verify test deployment
        run: |
          echo "=== Test workload status ==="
          kubectl get pods,service,deployment \
            --namespace weather-test \
            --output wide

          echo "=== Deployment rollout ==="
          kubectl rollout status deployment/weather-app \
            --namespace weather-test \
            --timeout=180s

      - name: Verify application is reachable
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            EXTERNAL_ADDRESS=$(kubectl get service weather-app \
              --namespace weather-test \
              --output jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -z "$EXTERNAL_ADDRESS" ]; then
              EXTERNAL_ADDRESS=$(kubectl get service weather-app \
                --namespace weather-test \
                --output jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            fi

            if [ -n "$EXTERNAL_ADDRESS" ]; then
              echo "Testing weather application at http://${EXTERNAL_ADDRESS}"
              if curl --fail --silent --show-error \
                --max-time 15 \
                "http://${EXTERNAL_ADDRESS}" \
                > /dev/null; then
                echo "Weather application is reachable."
                exit 0
              fi
            else
              echo "The LoadBalancer does not have an external address yet."
            fi

            echo "Attempt ${attempt}/12 failed; retrying in 10 seconds."
            sleep 10
          done

          echo "Weather application did not become reachable."
          exit 1

      - name: Collect rollout diagnostics
        if: failure()
        run: |
          echo "=== Kubernetes resources ==="
          kubectl get deployment,pods,service -n weather-test -o wide || true

          echo "=== Recent namespace events ==="
          kubectl get events -n weather-test \
            --sort-by=.metadata.creationTimestamp || true

          echo "=== Deployment details ==="
          kubectl describe deployment weather-app -n weather-test || true

          echo "=== Pod details ==="
          kubectl describe pods -n weather-test || true

          echo "=== Current container logs ==="
          kubectl logs deployment/weather-app -n weather-test \
            --all-containers=true --tail=200 || true

          echo "=== Previous container logs ==="
          kubectl logs deployment/weather-app -n weather-test \
            --all-containers=true --previous --tail=200 || true
